name: publish
on:
  push:
    tags: ['v*']
  workflow_dispatch:
jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      # trusted publishing (OIDC) は npm 11.5.1 以降でのみ効く。同梱の npm で足りる版を使う。
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # 仕組みと見本の module は同じパッケージで出る。版は 1 つしか無い。
      - name: the tag is the version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p 'require("./package.json").version')
          test "${GITHUB_REF#refs/tags/}" = "v$version"
      - run: npm test
      - run: npm publish
